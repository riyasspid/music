name: music
description: "Personal offline music player app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio
  just_audio: ^0.9.40
  audio_service: ^0.18.15

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File picking & media
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # ZIP archive
  archive: ^3.6.1

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  uuid: ^4.4.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # State management
  get: ^4.6.6

  # Notifications (sleep timer)
  flutter_local_notifications: ^17.2.2

  # Reactive streams
  rxdart: ^0.28.0
  google_fonts: ^8.2.1
  audio_metadata_reader: ^1.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
